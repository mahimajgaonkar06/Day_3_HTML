<!DOCTYPE html>
<html>
<head>
    <title>Display Features</title>
    <style>
        .A,.B{
            border-width: 2px;
            border-style: solid;
            width: 200px;
            border-color: gray;
            display: block;
            border-radius: 3px;
            margin: 5px;
            padding: 5px;
        }
        p{
            width: 200px;
            display: inline-block;
            vertical-align: middle;
        }
        img{
            margin-top: 50px;
            margin-left: 150px;
            height: 100px;
            width: 200px;
            object-fit: cover;
            
        }
        .noBorder{
            margin-top: 5px;
            border-radius: 25px;
            padding: 15px;
            font-size: medium;
            width: 500px;
            border: none;
            box-shadow: 0px 0 8px rgba(0, 0, 0, 0.15);
            
        }
            .signup-box {
        width: 580px;
        padding: 25px;
        box-sizing: border-box;
    }

    .name-row {
        display: flex;
        gap: 10px;
    }

    .signup-box input {
        height: 84px;
        box-sizing: border-box;
        border: 2px solid #ccc;
        border-radius: 16px;
        padding: 0 32px;
        font-size: 30px;
        outline: none;
    }

    .name-row input {
        width: 50%;
    }

    .signup-box .email {
        width: 100%;
        margin-top: 24px;
    }

    .signup-box input::placeholder {
        color: #707070;
    }

    .signup-btn {
        width: 100%;
        height: 95px;
        margin-top: 24px;
        border: none;
        border-radius: 16px;
        background-color: #3678df;
        color: white;
        font-size: 36px;
        font-weight: bold;
        cursor: pointer;
    }
    .uber-box {
    width: 680px;
    padding: 20px;
    box-sizing: border-box;
}

.uber-box h1 {
    margin: 0 0 40px 0;
    font-size: 52px;
    font-weight: 400;
}

.uber-box input {
    display: block;
    width: 100%;
    height: 80px;
    margin-bottom: 14px;
    padding: 0 30px;
    box-sizing: border-box;
    border: none;
    background-color: #f0f0f0;
    font-size: 25px;
    outline: none;
}

.uber-box input::placeholder {
    color: #666;
}

.uber-buttons {
    display: flex;
    gap: 35px;
    margin-top: 60px;
}

.uber-buttons button {
    height: 75px;
    padding: 0 38px;
    border: none;
    font-size: 24px;
    cursor: pointer;
}

.request-btn {
    background-color: black;
    color: white;
}

.schedule-btn {
    background-color: #eeeeee;
    color: black;}

        
        
    </style>
</head>
<body>
    <input class="A" type="text", placeholder="name">
    <input class="B" type="text", placeholder="Email">
    <p>Thanks for chatting with our customer support. Would you like to take our quick survey?</p>
    <button class="yes">Yes</button>
    <button class="no">No</button><br>
    <img src="go.png" alt="logo">
    <br><input class="noBorder" type="text" placeholder="Search Google or type a URL">
    <br>
     <div class="signup-box">

        <div class="name-row">
            <input type="text" placeholder="First name">
            <input type="text" placeholder="First name">
        </div>

        <input class="email" type="email" placeholder="Email">

        <button class="signup-btn">Sign Up</button>

    </div>

    <div class="uber-box">

        <h1>Request a ride now</h1>

        <input type="text" placeholder="Enter pickup location">

        <input type="text" placeholder="Enter destination">

        <div class="uber-buttons">
            <button class="request-btn">Request now</button>
            <button class="schedule-btn">Schedule for later</button>
        </div>

    </div>


</body>
</html>
